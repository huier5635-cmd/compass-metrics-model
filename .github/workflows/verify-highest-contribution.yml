name: Verify complete contribution rankings

on:
  push:
    branches: [verify/highest-contribution-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-search:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [elasticsearch, opensearch]
    env:
      COMPASS_TEST_SEARCH_URL: http://localhost:9200
      COMPASS_TEST_SEARCH_CLIENT: ${{ matrix.engine }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install the repository's declared dependencies
        run: python -m pip install -r requirements.txt requests==2.31.0
      - name: Start disposable search service on loopback
        run: |
          sudo sysctl -w vm.max_map_count=262144
          if [ "$COMPASS_TEST_SEARCH_CLIENT" = elasticsearch ]; then
            docker run -d --name compass-ranking-test -p 127.0.0.1:9200:9200 \
              -e discovery.type=single-node -e xpack.security.enabled=false \
              -e ES_JAVA_OPTS='-Xms512m -Xmx512m' \
              docker.elastic.co/elasticsearch/elasticsearch:6.8.23
          else
            docker run -d --name compass-ranking-test -p 127.0.0.1:9200:9200 \
              -e discovery.type=single-node -e DISABLE_INSTALL_DEMO_CONFIG=true \
              -e DISABLE_SECURITY_PLUGIN=true -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' \
              opensearchproject/opensearch:2.19.0
          fi
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://localhost:9200', timeout=2) as response:
                      print(response.read().decode())
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise RuntimeError('test search service did not start')
          PY
      - name: Prove eight regressions fail on exact upstream source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          targets = [Path('compass_metrics_v2/contributor_metrics_v2.py'),
                     Path('compass_metrics/contributor_metrics.py')]
          fixed = {target: target.read_bytes() for target in targets}
          original = {target: subprocess.check_output([
              'git', 'show',
              '3b5b042ed1db2ec95e58e032ccc5e9d92d690ce7:' + target.as_posix(),
          ]) for target in targets}
          runner = '''import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_highest_contribution.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 21, result.testsRun
          assert len(result.failures) == 8, len(result.failures)
          assert not result.errors, result.errors
          assert not result.skipped, result.skipped
          print('Baseline verified: 8 failed, 13 passed, 0 errors, 0 skips')
          '''
          try:
              for target in targets:
                  target.write_bytes(original[target])
              subprocess.run([sys.executable, '-c', runner], check=True)
          finally:
              for target in targets:
                  target.write_bytes(fixed[target])
          assert all(target.read_bytes() == fixed[target] for target in targets)
          PY
      - name: Run all twenty-one regressions on the fixed source
        run: python -m unittest discover -s tests -p test_highest_contribution.py -v
      - name: Verify actual three-way combination with quantity and headcount PRs
        run: |
          git fetch --no-tags origin 710eb81dde76520d7cc0d136c390b40020d81b70
          git fetch --no-tags origin cca61a790e1b9e489cf965eff4d7d77160b0e254
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          base = '3b5b042ed1db2ec95e58e032ccc5e9d92d690ce7'
          versions = [
              ('710eb81dde76520d7cc0d136c390b40020d81b70',
               ['compass_metrics/contributor_metrics.py', 'compass_metrics_v2/contributor_metrics_v2.py'],
               ['compass_metrics_v2/developer_metrics_v2.py', 'compass_metrics/contribution_utils.py',
                'tests/test_period_contribution_sums.py']),
              ('cca61a790e1b9e489cf965eff4d7d77160b0e254',
               ['compass_metrics_v2/contributor_metrics_v2.py', 'compass_metrics_v2/developer_metrics_v2.py'],
               ['compass_metrics/period_contributors.py', 'tests/test_non_code_contributor_counts.py']),
          ]
          targets = {Path(p) for _, shared, extra in versions for p in shared + extra}
          saved = {p: p.read_bytes() if p.exists() else None for p in targets}
          def blob(ref, path):
              return subprocess.check_output(['git', 'show', ref + ':' + path.as_posix()])
          try:
              with tempfile.TemporaryDirectory() as directory:
                  for ref, shared, extra in versions:
                      for relative in shared:
                          path = Path(relative)
                          ours, ancestor, theirs = [Path(directory) / name for name in ('ours', 'base', 'theirs')]
                          ours.write_bytes(path.read_bytes())
                          ancestor.write_bytes(blob(base, path))
                          theirs.write_bytes(blob(ref, path))
                          path.write_bytes(subprocess.check_output([
                              'git', 'merge-file', '-p', str(ours), str(ancestor), str(theirs)]))
                      for relative in extra:
                          path = Path(relative)
                          path.write_bytes(blob(ref, path))
              runner = """import unittest
          suite = unittest.TestSuite()
          for pattern in ('test_highest_contribution.py', 'test_non_code_contributor_counts.py', 'test_period_contribution_sums.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 65, result.testsRun
          assert result.wasSuccessful(), (result.failures, result.errors)
          assert not result.skipped, result.skipped
          print('Three-way combination verified: 65 passed, 0 errors, 0 skips')
          """
              subprocess.run([sys.executable, '-c', runner], check=True)
          finally:
              for path, content in saved.items():
                  if content is None:
                      path.unlink(missing_ok=True)
                  else:
                      path.write_bytes(content)
          assert all((p.read_bytes() if p.exists() else None) == v for p, v in saved.items())
          PY
      - name: Service diagnostics and cleanup
        if: always()
        run: |
          docker logs compass-ranking-test || true
          docker rm -f compass-ranking-test || true
